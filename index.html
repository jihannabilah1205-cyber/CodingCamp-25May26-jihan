<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <button id="theme-toggle" class="btn-secondary">🌙 Dark Mode</button>
        </header>

        <section class="balance-card" id="balance-card">
            <h2>TOTAL BALANCE</h2>
            <div class="balance-amount" id="total-balance">$0.00</div>
            
            <div class="limit-container">
                <label for="expense-limit">Set Expense Limit ($):</label>
                <input type="number" id="expense-limit" placeholder="e.g. 100" min="0">
                <p id="limit-warning" class="hidden">⚠️ Warning: You have exceeded your limit!</p>
            </div>
        </section>

        <section class="card">
            <h3>Add Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g. Cilok" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="e.g. 14.94" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="" disabled selected>Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </section>

        <div class="main-content">
            <section class="card transaction-section">
                <div class="section-header">
                    <h3>Transactions</h3>
                    <select id="sort-filter">
                        <option value="latest">Latest</option>
                        <option value="amount-high">Amount: High to Low</option>
                        <option value="amount-low">Amount: Low to High</option>
                        <option value="category">Sort by Category</option>
                    </select>
                </div>
                <div class="list-wrapper">
                    <ul id="transaction-list" class="scrollable-list">
                        </ul>
                </div>
            </section>

            <section class="card chart-section">
                <h3>Spending by Category</h3>
                <div class="chart-container">
                    <canvas id="spending-chart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
